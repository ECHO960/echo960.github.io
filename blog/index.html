<main>
  <section class="section" style="padding-top: 100px;">
    <div class="container">
      <h2>Blog</h2>
      <p class="section-desc">Occasional thoughts on machine learning, research, and engineering.</p>

      <!-- ============================================================
           HOW TO ADD A NEW POST:
           1. Duplicate the file `blog/_template.html` → `blog/your-post-slug.html`
           2. Fill in the title, date, tag, and body content
           3. Add a card below (copy the commented-out example)
           ============================================================ -->

      <!-- Example card (uncomment and fill when you have a post):
      <div class="blog-grid">

      -->

</main>

<footer>
  <div class="container">
    <p>© 2026 Chunhui Liu</p>
  </div>
</footer>

<script>
  const btn = document.getElementById('theme-btn');
  const root = document.documentElement;
  const saved = localStorage.getItem('theme');
  if (saved) root.dataset.theme = saved;
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
  btn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    localStorage.setItem('theme', next);
  });
</script>

</body>
